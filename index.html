<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="三天养成：周五加班夜到周日深夜，8题摸底定起点，每天三个节点，读懂一个不会说话、很毒舌也很冷的人。">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌑</text></svg>">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:dark}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif;background:#0E1217}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>读懂鲁月佳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --ink:#0E1217; --ink2:#141A21; --panel:#19212A; --raise:#212B36;
  --line:#2A3540; --line2:#3B4957;
  --tx:#E4EAF0; --tx2:#A3B0BC; --tx3:#6B7883;
  --her:#9FC3DC;        /* 她的声音 · 冷银蓝 */
  --sys:#C8905E;        /* 系统 · 暖铜，这页上唯一的温度 */
  --warm:#E0A17A;
  --good:#7FB894; --bad:#D9736B; --cream:#EEF4F8;
  --shadow:0 18px 40px -26px rgba(0,0,0,.95);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--tx);
  -webkit-text-size-adjust:100%; text-size-adjust:100%; overflow-x:hidden;
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(185deg, rgba(159,195,220,.07), transparent 42%),
    radial-gradient(820px 460px at 94% 108%, rgba(200,144,94,.10), transparent 64%);
  background-attachment:fixed;
}
.wrap{max-width:620px;margin:0 auto;padding:0 18px;padding-block:0 56px}

.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:linear-gradient(180deg,rgba(14,18,23,.98) 72%,rgba(14,18,23,.84));
  backdrop-filter:blur(10px);margin:0 -18px;padding:10px 18px 12px;border-bottom:1px solid var(--line)}
.hudtop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.day{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;color:var(--sys);text-transform:uppercase}
.day b{font-size:17px;color:var(--tx);font-weight:600}
.who{font-family:"ZCOOL XiaoWei",serif;font-size:13px;color:var(--tx3);margin-left:10px;letter-spacing:.08em}
.lovebox{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.lovebox b{font-family:"IBM Plex Mono",monospace;font-size:16px;color:var(--warm);font-variant-numeric:tabular-nums}
.lovebox .lb{font-size:9.5px;letter-spacing:.2em;color:var(--tx3)}
.lovebox svg{filter:drop-shadow(0 0 7px rgba(224,161,122,.45))}
.lovebox.pump{animation:pump .72s cubic-bezier(.3,1.5,.4,1)}
@keyframes pump{0%{transform:scale(1)}26%{transform:scale(1.34)}55%{transform:scale(.95)}100%{transform:scale(1)}}
.lovebox.crack{animation:crk .7s ease}
@keyframes crk{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px}
.bar{display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:8px}
.bar .n{font-size:11.5px;color:var(--tx2);letter-spacing:.04em;white-space:nowrap}
.bar .t{height:5px;background:#232E39;overflow:hidden;position:relative}
.bar .f{height:100%;transition:width .55s cubic-bezier(.2,.8,.3,1)}
.bar .v{font-family:"IBM Plex Mono",monospace;font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.bar .t::after{content:"";position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--line2)}
.bar.goal80 .t::after{left:80%}
.bar.goal20 .t::after{left:20%}
.bar.ok .v{color:var(--good)}
.bar.danger .v{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{font-size:10.5px;padding:2px 8px;border:1px solid var(--line2);color:var(--tx2);letter-spacing:.04em}
.chip.b{border-color:rgba(127,184,148,.45);color:var(--good);background:rgba(127,184,148,.07)}
.chip.d{border-color:rgba(217,115,107,.45);color:var(--bad);background:rgba(217,115,107,.07)}

h1{font-family:"ZCOOL XiaoWei",serif;font-size:32px;font-weight:400;letter-spacing:.04em;margin:34px 0 4px;text-wrap:balance;line-height:1.35}
h1 small{display:block;font-family:"Noto Sans SC";font-size:12px;font-weight:300;letter-spacing:.3em;color:var(--sys);margin-bottom:10px}
.lede{color:var(--tx2);font-size:14px;max-width:46em}
.eyebrow{font-size:11px;letter-spacing:.26em;color:var(--tx3);text-transform:uppercase;font-family:"IBM Plex Mono",monospace}

.card{background:var(--panel);border:1px solid var(--line);padding:18px 18px 16px;box-shadow:var(--shadow);margin-top:16px}
.scene{font-family:"ZCOOL XiaoWei",serif;color:var(--tx2);font-size:15px;line-height:1.95}
.scene::before{content:"";display:block;width:26px;height:1px;background:var(--line2);margin-bottom:12px}

/* 她的话不做成圆气泡：方角、一道冷色竖线，像一条收在那儿的消息 */
.say{display:flex;gap:11px;margin-top:16px;align-items:flex-start}
.ava{flex:0 0 32px;height:32px;display:grid;place-items:center;
  font-family:"ZCOOL XiaoWei",serif;font-size:15px;color:#101820;
  background:linear-gradient(150deg,#C3DCEC,#8FB3CC)}
.ava.sad{background:linear-gradient(150deg,#586673,#39444F);color:#A3B0BC}
.bub{border-left:2px solid var(--her);background:var(--raise);padding:10px 14px;
  font-family:"ZCOOL XiaoWei",serif;font-size:16px;line-height:1.9;color:var(--cream);max-width:100%;letter-spacing:.02em}
.bub.cold{color:var(--tx2)}
.react{margin-top:14px;padding-left:43px}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.opt{touch-action:manipulation;text-align:left;background:var(--ink2);border:1px solid var(--line);color:var(--tx);
  padding:11px 14px;cursor:pointer;font:inherit;font-size:14.5px;line-height:1.7;
  display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline;transition:border-color .18s,background .18s,transform .18s}
@media(hover:hover){.opt:hover{border-color:var(--her);background:#1C2630;transform:translateX(3px)}}
.opt:focus-visible{outline:2px solid var(--sys);outline-offset:2px}
.opt .k{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--her);letter-spacing:.1em}
.opt .tag{grid-column:2;font-size:10.5px;color:var(--tx3);letter-spacing:.08em}
.opt .tx{grid-column:2;grid-row:1}
.opt[disabled]{opacity:.34;cursor:default;transform:none}
.opt.picked{border-color:var(--her);background:#202B35;opacity:1}

.btn{touch-action:manipulation;display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--her);color:var(--her);
  padding:9px 20px;font:inherit;font-size:13.5px;letter-spacing:.06em;cursor:pointer;transition:.18s;margin-top:18px}
@media(hover:hover){.btn:hover{background:var(--her);color:#0E1217}}
.btn.q{border-color:var(--line2);color:var(--tx2);font-size:12px;padding:6px 14px}
@media(hover:hover){.btn.q:hover{background:var(--raise);color:var(--tx)}}
.btn:focus-visible{outline:2px solid var(--sys);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.banner{border-left:2px solid var(--sys);background:linear-gradient(90deg,rgba(200,144,94,.12),transparent 70%);
  padding:9px 14px;margin-top:20px;font-size:13px;color:var(--sys);letter-spacing:.04em}
.banner.v{border-color:var(--her);background:linear-gradient(90deg,rgba(159,195,220,.13),transparent 70%);color:var(--her)}
.banner.c{border-color:var(--bad);background:linear-gradient(90deg,rgba(217,115,107,.13),transparent 70%);color:var(--bad)}
.banner.s{border-color:var(--good);background:linear-gradient(90deg,rgba(127,184,148,.12),transparent 70%);color:var(--good)}

.deltas{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:14px}
.dl{border:1px solid var(--line);padding:8px 10px;background:var(--ink2)}
.dl .n{font-size:11px;color:var(--tx3)}
.dl .v{font-family:"IBM Plex Mono",monospace;font-size:16px;font-variant-numeric:tabular-nums}
.dl .c{font-family:"IBM Plex Mono",monospace;font-size:11px;margin-left:5px}
.up{color:var(--good)}.dn{color:var(--bad)}.fl{color:var(--tx3)}

.ilist{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.ia{touch-action:manipulation;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);
  background:var(--ink2);padding:9px 12px;cursor:pointer;font:inherit;color:var(--tx);text-align:left;transition:.18s}
@media(hover:hover){.ia:hover:not([disabled]){border-color:var(--sys);background:#232B33}}
.ia[disabled]{opacity:.38;cursor:default}
.ia .nm{font-size:14px}
.ia .cd{font-size:10.5px;color:var(--tx3);font-family:"IBM Plex Mono",monospace}
.ia .st{font-size:11px;color:var(--sys);font-family:"IBM Plex Mono",monospace}

.qnum{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.2em;color:var(--sys)}
.qtxt{font-family:"ZCOOL XiaoWei",serif;font-size:20px;line-height:1.7;margin:8px 0 2px;text-wrap:balance;letter-spacing:.02em}
.prog{display:flex;gap:4px;margin-top:14px}
.prog i{height:2px;flex:1;background:#232E39}
.prog i.on{background:var(--her)}

.end{text-align:center;padding:30px 0}
.end .tier{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.3em;color:var(--sys)}
.end h2{font-family:"ZCOOL XiaoWei",serif;font-size:28px;margin:10px 0 14px;text-wrap:balance;font-weight:400}
.end p{color:var(--tx2);text-align:left;max-width:40em;margin:0 auto 12px;font-size:14.5px}
.fin{font-family:"ZCOOL XiaoWei",serif;color:var(--cream);font-size:17px;line-height:2;text-align:left;max-width:40em;margin:18px auto 0;
  border-left:2px solid var(--her);padding-left:16px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:900;overflow:hidden;contain:strict}
#fx span{position:absolute;left:0;top:0;will-change:transform,opacity;line-height:1;user-select:none}
#fx .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 25%,transparent 36%,rgba(60,88,112,.42) 100%)}

.fade{animation:fu .4s cubic-bezier(.2,.8,.3,1) both}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.foot{margin-top:30px;color:var(--tx3);font-size:11.5px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lnk{color:var(--tx3);background:none;border:0;font:inherit;font-size:11.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
@media(hover:hover){.lnk:hover{color:var(--her)}}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-size:12px;color:var(--tx3);letter-spacing:.08em}
details ul{margin:10px 0 0;padding-left:18px;color:var(--tx2);font-size:12.5px;line-height:1.9}

@media(max-width:480px){
  .wrap{padding:0 14px;padding-block:0 40px}
  .hud{margin:0 -14px;padding:8px 14px 10px}
  .hudtop{gap:8px;margin-bottom:8px;flex-wrap:nowrap;align-items:center}
  .who{display:none}
  .day{font-size:10.5px;letter-spacing:.1em;white-space:nowrap}
  .day b{font-size:15px}
  .hudtop .day:nth-of-type(2){font-size:10px;opacity:.75}
  .lovebox{gap:4px}.lovebox .lb{display:none}.lovebox b{font-size:15px}
  .bars{grid-template-columns:repeat(5,1fr);gap:7px}
  .bar{grid-template-columns:1fr;justify-items:stretch;gap:3px;text-align:center}
  .bar .n{font-size:9.5px;letter-spacing:0;text-align:center;transform:scale(.96)}
  .bar .t{height:4px;width:100%}
  .bar .v{font-size:13px;text-align:center}
  .chips{gap:4px;margin-top:7px}.chip{font-size:9.5px;padding:1px 6px}
  h1{font-size:26px;margin-top:26px}
  .lede{font-size:13.5px}
  .card{padding:15px 14px 14px}
  .qtxt{font-size:18px}
  .scene{font-size:14.5px;line-height:1.9}
  .bub{font-size:15.5px;padding:9px 12px}
  .ava{flex:0 0 28px;height:28px;font-size:14px}
  .say{gap:9px}
  .react{padding-left:18px}
  .opt{padding:13px 13px;font-size:14px}
  .opt .tag{font-size:10px}
  .btn{min-height:44px;padding:10px 20px}
  .btn.q{min-height:38px}
  .deltas{grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:7px}
  .dl{padding:7px 8px}
  .ia{padding:11px 11px}
  .end h2{font-size:24px}
  .fin{font-size:16px;padding-left:13px}
  .foot{font-size:11px;gap:9px}
}
@media(max-width:340px){.bar .n{font-size:8.5px}.bar .v{font-size:12px}}
</style>

</head>
<body>
<div id="fx" aria-hidden="true"></div>
<div class="wrap">
  <div class="hud" id="hud" hidden></div>
  <div id="app"></div>
  <div class="foot">
    <span>读懂鲁月佳 · 三天</span>
    <button class="lnk" id="restart">重新开始</button>
    <span id="savenote"></span>
  </div>
</div>

<script>
/* ============ 题库 ============ */
const QUIZ=[
 {q:"鲁月佳的生日是？",o:["1999年6月14日","1999年6月4日","1999年4月16日","1998年6月14日"],a:0},
 {q:"她是什么星座？",o:["金牛座","双子座","巨蟹座","狮子座"],a:1},
 {q:"她属什么？",o:["虎","兔","龙","蛇"],a:1},
 {q:"她已读不回、突然不说话了，这通常意味着什么？",
  o:["她在忙，没别的意思","她不高兴，在等你自己发现——但你问的方式不对，门会关得更死","她在准备跟你摊牌","她真的没事，她就是不爱回消息"],a:1},
 {q:"她说话很毒的那一下，底下真正在动的是什么？",
  o:["她心情好，在跟你开玩笑","她是真的看不起你","她在看这句话能不能把你赶走","她只是想赢这场对话"],a:2},
 {q:"下面四种夸，哪一种对她有效？",
  o:["你好厉害，你真的很强","你今天状态看起来不错","你那版方案里把客户没说出口的那点补上了，那段是你加的吧","整个公司就你最靠谱"],a:2},
 {q:"你们之间有了矛盾，最糟糕的处理方式是哪一种？",
  o:["当场把她按住，要她把话说清楚","先不提这件事，但明确告诉她你不会走","先认下自己哪句话不合适","给她一晚上，第二天再找她"],a:0},
 {q:"她临时变卦，把你排好的安排整个推翻了。她心里怎么想？",
  o:["她知道自己理亏，在等你说没事","她是真的不觉得这需要解释","她在试探你会不会发火","她其实很愧疚，只是说不出口"],a:1}
];
const QEXP=["1999.06.14。","6月14日，双子座。","1999年，属兔。双子的善变叠上兔的敏感——外面跳脱，里面全是戏。",
 "她不说话从来不是没事。但她也受不了被审问：问错了，门关得更死。",
 "毒舌是她的试纸。她在看，这一句能不能把你赶走。",
 "笼统的夸对她无效，那跟她领导的客套话没区别。她要的是“你真的看过我做的东西”。",
 "她最怕正面冲突。当场逼她说清楚，她不会吵，她会整个人缩回去。",
 "她是真的不觉得需要解释。这不是装的，这就是她——你得先接受这一点，再谈别的。"];

/* ============ 事件库 ============
   d = [内耗, 松弛度, 兴致, 信任值, 偏爱度]   内耗为正=变糟
   m = pref读懂 / emp扛住 / perf敷衍 / lect硬碰 */
const EV=[
/* ---------- 她难得主动 share ---------- */
{t:"share",s:"周五 23:14。她发来一张照片：整层办公室只剩她工位一盏灯。",q:"你看，就剩我了",
 o:[{tag:"接住这张照片真正的意思",tx:"第几次了。你那盏灯我看着都觉得冷——现在下楼，我陪你走到地铁口。",m:"pref",d:[-11,9,8,9,12],r:"……（过了一分半）我已经在电梯里了。你怎么知道我不想一个人走那段路。"},
     {tag:"心疼一句",tx:"又加这么晚，辛苦了。",m:"neu",d:[-1,2,1,1,1],r:"嗯。"},
     {tag:"讲道理",tx:"这种公司早点换吧，不值得。",m:"lect",d:[9,-8,-7,-8,-9],r:"……我就发张照片。没让你给我规划人生。"}]},
{t:"share",s:"她转来一条招聘信息，一个字没配。",q:"",
 o:[{tag:"读出她没说的那句",tx:"你看了多久了。不用解释，我就问一句——真想走的话，你需要我做什么。",m:"pref",d:[-10,8,9,10,11],r:"……（很久）我存这条两个月了。你是第一个没先问我“你确定吗”的人。"},
     {tag:"问她想法",tx:"这个不错啊，你想投吗？",m:"neu",d:[0,1,2,1,0],r:"随便看看。"},
     {tag:"泼冷水",tx:"现在行情这么差，别乱跳。",m:"lect",d:[10,-9,-7,-9,-9],r:"知道了。当我没发。"}]},
{t:"share",s:"她买了个很贵的香薰，发来链接，价签没打码。",q:"我买了这个。三百八。我是不是疯了",
 o:[{tag:"站她这边",tx:"不疯。你这个月加了多少小时，三百八换一个回家想打开的味道，便宜。",m:"pref",d:[-9,8,10,7,10],r:"……（笑了一声）就你会说话。那我再买一个。"},
     {tag:"附和说贵",tx:"是有点贵哈。",m:"perf",d:[6,-5,-6,-4,-6],r:"嗯。我也觉得。退了。"},
     {tag:"问味道",tx:"什么味的？",m:"neu",d:[0,1,2,0,0],r:"雪松。……你不觉得贵就行。"}]},
{t:"share",s:"她发来一张截图：同一份方案，文件名已经排到 v8。",q:"第八版。甲方说还是第一版好",
 o:[{tag:"具体到她改的那部分",tx:"第八版里你把他们没说出口的那条风险补上了。第一版没有。他们看不出来，不代表那不是你加的。",m:"pref",d:[-11,9,9,11,12],r:"……你真的翻了？（停了一下）我以为没人会去看中间那几版。"},
     {tag:"安慰",tx:"甲方都这样，别放在心上。",m:"perf",d:[6,-5,-5,-5,-6],r:"嗯，都这样。"},
     {tag:"夸她辛苦",tx:"改八版太累了，你厉害。",m:"neu",d:[-1,2,1,1,1],r:"……谢谢。"}]},
{t:"share",s:"周六下午，她难得发了条长消息，讲她小时候的一件事，讲到一半停住了。",q:"算了，没什么意思。你别看了",
 o:[{tag:"不让她撤回",tx:"我看完了，而且我想听后半段。你很少讲这些，我不想它停在一半。",m:"pref",d:[-10,10,7,10,11],r:"……（又打了很久）好吧。那你听完不许评价。"},
     {tag:"顺着她",tx:"好，那不说了。",m:"perf",d:[8,-7,-6,-7,-8],r:"嗯。（她把那段删了）"}]},
/* ---------- 冷试探 probe ---------- */

/* ---------- 毒舌 blow ---------- */
{t:"blow",s:"你发了句关心过去，她秒回。",q:"你好烦",
 o:[{tag:"不接刺，接刺底下那件事",tx:"行，我烦。那烦人的继续问一句：今天是哪件事把你弄成这样的。",m:"emp",d:[-10,11,6,9,9],r:"……（过了两分钟）今天开了四个会。四个。一个都跟我没关系。"},
     {tag:"受伤退开",tx:"行吧，那我不说了。",m:"perf",d:[9,-8,-7,-8,-9],r:"嗯。"},
     {tag:"回敬",tx:"我关心你还有错了？",m:"lect",d:[13,-12,-10,-11,-12],r:"……没错。是我有问题。"}]},
{t:"blow",s:"你劝她别熬了，早点睡。",q:"你是我妈吗",
 o:[{tag:"顺着她的刺往下走",tx:"不是。你妈不会陪你熬到两点，我会。",m:"pref",d:[-9,9,8,8,11],r:"……（半天）那你陪着吧。别说话就行。"},
     {tag:"继续劝",tx:"我是为你好，身体最重要。",m:"lect",d:[12,-11,-9,-10,-11],r:"知道了。谢谢关心。"},
     {tag:"闭嘴",tx:"……好吧。",m:"perf",d:[7,-6,-6,-6,-7],r:"（她把对话框关了）"}]},
{t:"blow",s:"你认真夸了她一句，她的回复隔了十秒才来。",q:"你这话跟我领导说得一模一样",
 o:[{tag:"把话说到她领导说不出的地方",tx:"你领导夸的是结果。我说的是你改到第三版的时候自己把那段推翻了——那次没人让你改。",m:"pref",d:[-11,10,8,11,13],r:"……（很久）你怎么会注意到那个。"},
     {tag:"赔笑",tx:"哈哈那我换个说法。",m:"perf",d:[6,-5,-4,-5,-6],r:"不用了。"},
     {tag:"被刺到",tx:"我是真心的，你非要这么说吗。",m:"lect",d:[11,-10,-9,-9,-10],r:"……我没说你不真心。算了。"}]},
{t:"blow",s:"你提了一句另一个朋友的事。她的语气立刻降了温。",q:"那你去找他聊啊，他肯定比我有意思",
 o:[{tag:"直接走到她面前",tx:"他没你有意思。而且这件事我只想跟你说——现在，回来。",m:"pref",d:[-10,9,8,9,13],r:"……（停顿）谁要你哄。……说吧，什么事。"},
     {tag:"解释",tx:"我就是随口提一句，你别多想。",m:"lect",d:[12,-11,-10,-10,-12],r:"我没多想。我在陈述事实。"},
     {tag:"冷回",tx:"你今天火气真大。",m:"lect",d:[14,-13,-11,-12,-13],r:"嗯。那你离我远点。"}]},
{t:"blow",s:"她今天被耗干了，你成了出气口。",q:"你怎么这么没意思。跟你说话跟交周报一样",
 o:[{tag:"扛住，不回击",tx:"周报交完还得被打回来呢。你骂，我听着，不打回。",m:"emp",d:[-11,12,7,10,9],r:"……（很久）对不起。不是说你。我今天真的不行。"},
     {tag:"也冷下来",tx:"那你别跟我说了。",m:"perf",d:[11,-10,-9,-10,-11],r:"好。"},
     {tag:"讲理",tx:"我哪里没意思了，你说清楚。",m:"lect",d:[14,-13,-11,-12,-13],r:"……算了，没什么。"}]},
/* ---------- 冷处理 / 消失 emo ---------- */
{t:"emo",s:"消息显示已读，四个小时没有动静。",q:"（没有回复）",
 o:[{tag:"不追问，只留门",tx:"看到你在忙。我这边不急，你想说的时候说。我在。",m:"pref",d:[-10,8,5,9,10],r:"（晚上十一点）……我没在忙。我就是不知道说什么。谢谢你没追着问。"},
     {tag:"连环追问",tx:"你怎么了？是不是我说错话了？你回我一下。",m:"lect",d:[12,-11,-8,-9,-9],r:"……我只是不想说话。这也要解释吗。"},
     {tag:"也不理",tx:"（等她先开口）",m:"perf",d:[10,-9,-9,-9,-10],r:"（两天后她才发来一句“在吗”，语气客气得像同事）"}]},
{t:"emo",s:"你点开她的朋友圈，变成了三天可见。昨天还不是。",q:"（她没有任何说明）",
 o:[{tag:"不提这件事，给别的入口",tx:"（不提朋友圈，发了一张她肯定会笑的图）这个，像不像你上周说的那个领导。",m:"pref",d:[-9,8,9,8,9],r:"……（三分钟后）哈哈哈哈太像了。（她没解释朋友圈的事，但晚上又改回来了）"},
     {tag:"直接问",tx:"你朋友圈怎么设成三天了？",m:"lect",d:[10,-9,-7,-8,-8],r:"没什么。就是不想让人看。"}]},
{t:"emo",s:"周日晚上八点。你发了三条，她回了一个字。",q:"嗯",
 o:[{tag:"点破周日晚上",tx:"明天周一。你每到这个点就会这样，不是因为我。要不要我陪你把今晚耗完。",m:"pref",d:[-12,9,7,10,11],r:"……（很久）你连这个都发现了。好。你别挂。"},
     {tag:"问她怎么了",tx:"你怎么了？",m:"neu",d:[3,-2,-2,-1,-2],r:"没事。"},
     {tag:"知难而退",tx:"那你早点休息吧。",m:"perf",d:[9,-8,-8,-8,-9],r:"嗯。"}]},
{t:"emo",s:"她说完三个字就下线了。",q:"我没事",
 o:[{tag:"不拆穿，只留一句",tx:"好。那我在这儿待着，你什么时候想说都行，几点都行。",m:"emp",d:[-9,9,5,9,9],r:"（凌晨一点她上线了）……你还在啊。"},
     {tag:"戳破",tx:"你明明就有事。",m:"lect",d:[11,-10,-8,-9,-9],r:"……我说了我没事。"}]},
{t:"emo",s:"周五深夜，她发来一句没头没尾的话，发完又撤回了。",q:"（对方撤回了一条消息）",
 o:[{tag:"假装没看见，但把位置留着",tx:"（不问撤回的事）我在，随时。",m:"pref",d:[-10,9,5,10,10],r:"……（很久）刚才那句太矫情了。但是，谢谢你没问。"},
     {tag:"追问撤回了什么",tx:"你刚才发了什么？撤回干嘛。",m:"lect",d:[11,-10,-8,-9,-9],r:"手滑。没什么。"}]},
/* ---------- 中性日常 daily ---------- */
{t:"daily",s:"晚上七点，她在外卖软件上翻了二十分钟。",q:"吃什么好。都不想吃",
 o:[{tag:"替她做决定",tx:"上次那家粥，要那个加溏心蛋的。你现在没力气选，我替你选。",m:"pref",d:[-7,6,5,6,7],r:"……好。（三分钟后）你怎么记得我要加蛋。"},
     {tag:"给选项",tx:"粥、面、还是米饭？",m:"neu",d:[1,0,1,0,0],r:"……都行。算了我不吃了。"}]},

     {tag:"讲原理",tx:"你应该先理解一下绝对引用的概念。",m:"lect",d:[8,-7,-5,-6,-7],r:"我没问概念。"}]},
{t:"daily",s:"她在地铁上，站了四十分钟。",q:"还有六站",
 o:[{tag:"陪她把这六站说完",tx:"六站。那正好够你讲完今天最离谱的那件事。开始。",m:"pref",d:[-7,6,7,5,7],r:"……（真的讲了）你是不是故意的。我都不觉得挤了。"},

     {tag:"开玩笑",tx:"编呗，大家不都这么写。",m:"neu",d:[1,0,2,0,0],r:"也是。"}]},
{t:"daily",s:"她问了一句很轻的话。",q:"那个剧你看了吗。就我上次说的那个",
 o:[{tag:"看了，并且记得她为什么推荐",tx:"看了。第四集那段你肯定哭了——你推荐给我的时候就是冲那段来的吧。",m:"pref",d:[-7,6,8,7,8],r:"……你怎么知道。（停）对，就是那段。"},
     {tag:"还没看",tx:"还没来得及看。",m:"perf",d:[5,-4,-5,-4,-5],r:"哦。那算了。"}]},

 o:[{tag:"推掉",tx:"（回朋友：今天不行，有约了）",m:"pref",d:[-10,9,8,9,14],r:"你是不是推了什么。……（停）你干嘛啊。（但她那天话特别多）"},

     {tag:"附和",tx:"她确实是有点难搞。",m:"lect",d:[18,-16,-14,-18,-18],r:"原来你背后是这么说我的。"}]},

     {tag:"安慰",tx:"没事的，别担心。",m:"perf",d:[9,-8,-7,-8,-9],r:"你又不是医生。"},
     {tag:"说教",tx:"所以叫你别熬夜，你看吧。",m:"lect",d:[17,-16,-14,-16,-16],r:"……行。是我活该。"}]}

function apply(d,mark,ctx){
  const A=S.A,H=S.H,B=S.B,D=S.D,out={};
  KEY.forEach((k,i)=>{
    let v=d[i]||0;
    if(k==="p"){ if(v>0&&B.rely)v*=0.8; if(v<0&&D.disap)v*=0.6; }
    else{
      if(v>0){
        if(D.disap)v*=0.5;
        if(S.fatLv>=3)v*=0.6;
        if(k==="l"&&D.tired)v=0;
        if(B.tune&&ctx==="deep")v*=1.25;
        if(B.echo&&ctx==="act")v*=1.12;
      }else{
        if(ctx==="probe"&&B.calm)v*=(1-0.18*B.calm);
      }
    }
    let nv=cl(A[k]+v);
    if(k==="t"&&D.crack)nv=Math.min(nv,80);
    out[k]=Math.round((nv-A[k])*10)/10; A[k]=nv;
  });
  if(mark&&H[mark]!==undefined)H[mark]++;
  if(mark==="perf"||mark==="lect")H.fat+=mark==="lect"?1.6:1.1;
  if(mark==="pref"||mark==="emp")H.fat=Math.max(0,H.fat-0.7);
  if((ctx==="blow"||ctx==="emo")&&(mark==="emp"||mark==="pref"))H.held++;
  return out;
}

function pickEvents(n){
  const A=S.A,H=S.H;
  let w={share:3,probe:3,blow:2,emo:2,daily:3,mine:1.8};
  if(A.p>65){w.blow+=2;w.emo+=3;w.share-=1;w.daily-=1}
  if(A.p<35&&A.m>60){w.share+=2;w.daily+=1;w.blow-=1}
  if(H.poss>58||S.D.doubt){w.probe+=3;w.mine+=1}
  if(A.m<50||A.e<50){w.mine+=1}
  if(A.e<40){w.emo+=2;w.blow+=1}
  if(S.fatLv>=2){w.probe-=3;w.blow-=2;w.share-=2;w.daily+=4;w.emo-=1}
  if(S.day===1){w.blow+=3;w.probe+=2;w.share+=1;w.daily-=1}
  if(S.day===2){w.share+=2;w.daily+=2;w.mine+=2;w.blow-=1}
  if(S.day===3){w.emo+=3;w.probe+=2;w.mine+=1;w.daily-=1}
  Object.keys(w).forEach(k=>w[k]=Math.max(0,w[k]));
  const out=[];
  for(let i=0;i<n;i++){
    const tot=Object.values(w).reduce((a,b)=>a+b,0)||1;
    let r=Math.random()*tot,ty="daily";
    for(const k in w){r-=w[k];if(r<=0){ty=k;break}}
    let pool=EV.map((e,ix)=>({e,ix})).filter(o=>o.e.t===ty&&!S.used.includes(o.ix)&&!out.includes(o.ix));
    if(!pool.length){S.used=S.used.filter(ix=>EV[ix].t!==ty);pool=EV.map((e,ix)=>({e,ix})).filter(o=>o.e.t===ty&&!out.includes(o.ix))}
    if(!pool.length)continue;
    const p=pool[Math.floor(Math.random()*pool.length)];
    out.push(p.ix);S.used.push(p.ix);w[ty]=Math.max(0,w[ty]-1.5);
  }
  return out.map(ix=>({k:"ev",d:EV[ix]}));
}

function buildDay(){
  const pre=[],post=[],A=S.A,H=S.H,d=S.day;
  if(d===1)pre.push({k:"st",d:ST.d1open});
  if(d===2){
    if(A.t>=55&&S.heart===0)pre.push({k:"st",d:ST.heart1});
    if(Math.random()<0.55&&!S.done.gone){S.done.gone=1;post.push({k:"st",d:ST.gone})}
    post.push({k:"st",d:ST.ex1});
  }
  if(d===3){
    if(!S.done.gone){S.done.gone=1;pre.push({k:"st",d:ST.gone})}
    if(A.t>=75&&H.acc>=35&&S.heart===1)post.push({k:"st",d:ST.heart2});
    const healthy=A.e>=70&&A.m>=70&&A.t>=70&&A.l>=70&&A.p<=35;
    if(S.heart>=1&&H.acc>=40&&healthy&&S.dual===0)post.push({k:"st",d:ST.dual});
    post.push({k:"st",d:ST.d3final});
  }
  S.q=pre.concat(pickEvents(3)).concat(post);
  S.q.forEach(it=>it.ord=shuf(it.d.o.length));S.si=0;S.acts=[];S.pre={...A,lv:S.fatLv};
}

function judge(g){
  let h=0;["e","m","t","l"].forEach(k=>{if(g[k]<0)h-=g[k]});if(g.p>0)h+=g.p;
  const net=(g.e+g.m+g.t+g.l)-g.p;
  if(net>=3)return{v:1,mag:Math.max(1,net/3)};
  if(net<=-3)return{v:-1,mag:Math.max(1,h/2)};
  return{v:0,mag:1};
}

  const d=S.day,H=S.H,A=S.A,out=[];
  if(d===1){
    const m=[["pref","读懂型"],["emp","扛得住型"],["lect","硬碰型"],["perf","敷衍型"]].sort((a,b)=>H[b[0]]-H[a[0]])[0];
    S.label=m[1];
    out.push(["v","📌 第一晚结束 · 她对你的判断已经成型：<b>"+m[1]+"</b>。"+
      ({"读懂型":"她发现你听得懂她没说出口的那半句。明天她会多给你一点。",
        "扛得住型":"她扎你，你没走。她开始试第二刀，但语气会软一点。",
        "硬碰型":"你每次都要把话讲清楚。她已经开始省略句子了。",
        "敷衍型":"她确认了：你跟别人没什么区别。她不会再浪费力气。"})[m[1]]]);
  }
  if(d===2){
    const good=A.t>=62&&A.l>=58&&A.p<=50;
    out.push([good?"v":"c","📌 第二天结束 · 分水岭｜"+(good?"她今天说的话比前一天多。明天她会把那个一直没问出口的问题摆到桌上。":"她在往回收。明天周日，如果今天没能接住她，明天只会更冷。")]);
    if(!good)S.H.fat+=2;
  }
  const lv=S.fatLv;
  if(lv&&lv!==S.pre.lv){
    out.push(["c",["","🔸 疏远 Lv1 · 她不再主动分享了。",
      "🔸 疏远 Lv2 · 她开始跟你用客气话。不扎你了，也不要你哄了。",
      "🔸 疏远 Lv3 · 她不会再在你面前露出任何真实情绪。你做什么都减半。",
      "🔸 疏远 Lv4 · 她已经把你归进“普通联系人”了。"][lv]]);
  }
  return out;
}
function settle(){
  const A=S.A,p=S.pre;
  if(A.p>70)S.H.frag=cl(S.H.frag-2.5);
  if(S.H.held>=(S.preHeld||0)+2)S.H.frag=cl(S.H.frag+2);
  S.preHeld=S.H.held;
  derive();
  const msgs=nodeMsg();
  const rows=KEY.map(k=>{const c=Math.round((A[k]-p[k])*10)/10;
    const good=k==="p"?c<0:c>0;
    return `<div class="dl"><div class="n">${NAME[k]}</div><div class="v">${Math.round(A[k])}<span class="c ${c===0?"fl":good?"up":"dn"}">${c>0?"▲"+c:c<0?"▼"+Math.abs(c):"—"}</span></div></div>`}).join("");
  const unl=ACTS.map(a=>({a,ok:a.c(S),used:S.acts.includes(a.id)}));
  const list=unl.map(u=>`<button class="ia" data-id="${u.a.id}" ${u.ok&&!u.used&&S.acts.length<1?"":"disabled"}>
      <span><span class="nm">${u.a.n}</span><br><span class="cd">${u.a.cd}</span></span>
      <span class="st">${u.used?"今日已用":u.ok?(S.acts.length>=1?"今日已满":"可发起"):"未解锁"}</span></button>`).join("");
  hud();
  const last=S.day>=3;
  render(`<div style="padding-top:18px">
    <div class="eyebrow">${DAYNAME[S.day]} · 结算</div>
    ${bans()}
    ${msgs.map(m=>`<div class="banner ${m[0]}">${m[1]}</div>`).join("")}
    <div class="card"><div class="eyebrow">今日属性变动</div><div class="deltas">${rows}</div></div>
    <div class="card"><div class="eyebrow">可主动发起的互动 · 今日一次（${S.acts.length}/1）</div><div class="ilist">${list}</div></div>
    <div class="row"><button class="btn" id="nx">${last?"周日结束 · 终章结算":"进入"+DAYNAME[S.day+1]}</button></div></div>`);
  document.querySelectorAll(".ia").forEach(b=>b.onclick=()=>actRun(b.dataset.id));
  on("nx",()=>{ if(last){finale();return} nextDay(); });
}
function nextDay(){
  const A=S.A;
  A.p=cl(A.p+(S.B.rely?1.8:2.8));
  if(A.p>70){A.e=cl(A.e-2);A.m=cl(A.m-2)}
  if(A.p<30){A.e=cl(A.e+1);A.m=cl(A.m+1)}
  if(S.fatLv>=2){A.l=cl(A.l-1.5);A.m=cl(A.m-1)}
  derive();
  if(S.fatLv>=4&&S.day>=2){ending("drift");return}
  if(deathCheck()){ending("broke");return}
  S.day++;S.pre={...A,lv:S.fatLv};buildDay();step();
}
/* ---------- 主动互动 ---------- */
function actRun(id){
  const a=ACTS.find(x=>x.id===id);
  if(a.qa)return actQA(a,null);
  hud();const od=shuf(a.o.length);
  render(`<div style="padding-top:18px"><div class="banner s">💠 主动互动 · ${a.n}</div>
   <div class="card"><p class="scene">${a.i}</p>${say(a.q)}
   <div class="opts">${od.map((oi,i)=>`<button class="opt" data-i="${oi}"><span class="k">${"ABCD"[i]}</span><span class="tx">${a.o[oi].tx}</span></button>`).join("")}</div>
   </div></div>`);
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o=a.o[+b.dataset.i];
    const gain=apply(o.d,o.m,id==="tanxin"?"deep":"act");
    if(o.acc)S.H.acc=cl(S.H.acc+o.acc);
    S.acts.push(id);derive();
    const dead=deathCheck(),J=judge(gain);
    render(`<div style="padding-top:18px"><div class="banner s">💠 主动互动 · ${a.n}</div>
      <div class="card"><p class="scene">${a.i}</p>${say(a.q)}
      <div class="opts"><button class="opt picked" disabled><span class="tx">${o.tx}</span></button></div>
      <div class="react">${say(o.r,"",J.v<0?PICK(SADFACE):"")}</div></div>${bans()}
      <button class="btn" id="bk">返回结算</button></div>`);
    hud();
    burst(J.v>0?"love":J.v<0?"cry":"smile",J.mag);
    on("bk",()=>dead?ending("broke"):settle());
  });
}
function actQA(a,bi){
  hud();
  const head=`<div class="banner s">\ud83d\udca0 主动互动 · ${a.n}</div>`;
  if(bi===null){
    const ao=shuf(a.qa.length);
    render(`<div style="padding-top:18px">${head}
      <div class="card"><p class="scene">${a.i}</p>${say(a.q)}
      <div class="opts">${ao.map((qi,i)=>`<button class="opt" data-i="${qi}"><span class="k">${"ABCD"[i]}</span><span class="tx">${a.qa[qi].ask}</span><span class="tag">先抛问句，等她接话</span></button>`).join("")}</div>
      </div></div>`);
    document.querySelectorAll(".opt").forEach(x=>x.onclick=()=>actQA(a,+x.dataset.i));
    return;
  }
  const b=a.qa[bi],ho=shuf(b.hit.length);
  const ask=`<div class="opts"><button class="opt picked" disabled><span class="k">你</span><span class="tx">${b.ask}</span></button></div>`;
  render(`<div style="padding-top:18px">${head}
    <div class="card"><p class="scene">${a.i}</p>${say(a.q)}${ask}
    <div class="react">${say(b.her)}</div>
    <div class="opts" style="margin-top:16px">${ho.map((oi,i)=>`<button class="opt" data-i="${oi}"><span class="k">${"ABCD"[i]}</span><span class="tx">${b.hit[oi].tx}</span><span class="tag">接下去的答句</span></button>`).join("")}</div>
    </div></div>`);
  document.querySelectorAll(".opt:not(.picked)").forEach(x=>x.onclick=()=>{
    const o=b.hit[+x.dataset.i];
    const gain=apply(o.d,o.m,"act");
    if(o.acc)S.H.acc=cl(S.H.acc+o.acc);
    S.acts.push(a.id);derive();
    const dead=deathCheck(),J=judge(gain);
    render(`<div style="padding-top:18px">${head}
      <div class="card"><p class="scene">${a.i}</p>${say(a.q)}${ask}
      <div class="react">${say(b.her)}</div>
      <div class="opts" style="margin-top:16px"><button class="opt picked" disabled><span class="k">你</span><span class="tx">${o.tx}</span></button></div>
      <div class="react">${say(o.r,"",J.v<0?PICK(SADFACE):"")}</div></div>${bans()}
      <button class="btn" id="bk">返回结算</button></div>`);
    hud();
    burst(J.v>0?"love":J.v<0?"cry":"smile",J.mag);
    on("bk",()=>dead?ending("broke"):settle());
  });
}
/* ---------- 结局 ---------- */
function finale(){
  const A=S.A,H=S.H;
  const ok=A.e>=80&&A.m>=80&&A.t>=80&&A.l>=80&&A.p<=20;
  if(ok&&S.dual>=1&&H.acc>=45&&S.final!=="no"&&!S.D.crack)return ending("true");
  if(ok)return ending("good");
  if(H.acc>=70)return ending("self");
  if(A.l>=78&&(A.t<62||A.e<62))return ending("hot");
  if(S.fatLv>=3)return ending("drift");
  if(A.e>=60&&A.m>=60&&A.t>=60&&A.l>=60&&A.p<=40)return ending("normal");
  return ending("cool");
}
function ending(k){
  S.end=k;S.ph="end";const e=ENDS[k];
  hud();
  const H=S.H;
  render(`<div class="end" style="padding-top:10px">
    <div class="tier">${e.tier} · ${DAYNAME[S.day]||"周日"}</div>
    <h2>${e.t}</h2>
    ${e.p.map(x=>`<p>${x}</p>`).join("")}
    <div class="fin">${e.f}</div>
    <div class="card" style="text-align:left"><div class="eyebrow">终章数据</div>
      <div class="deltas">${KEY.map(k2=>`<div class="dl"><div class="n">${NAME[k2]}</div><div class="v">${Math.round(S.A[k2])}</div></div>`).join("")}</div>
      <div class="deltas" style="margin-top:8px">
        <div class="dl"><div class="n">自我接纳（隐藏）</div><div class="v">${Math.round(H.acc)}</div></div>
        <div class="dl"><div class="n">脆弱阈值（隐藏）</div><div class="v">${Math.round(H.frag)}</div></div>
        <div class="dl"><div class="n">占有倾向（隐藏）</div><div class="v">${Math.round(H.poss)}</div></div>
        <div class="dl"><div class="n">说人话阶段</div><div class="v">${S.heart<0?"锁死":S.heart}</div></div>
      </div>
      <p style="color:var(--tx3);font-size:12px;margin:12px 0 0">记忆印记 · 读懂 ${H.pref} / 扛住 ${H.emp} / 敷衍 ${H.perf} / 硬碰 ${H.lect}　｜　印象标签：${S.label||"未定型"}</p>
    </div>
    <button class="btn" id="again">再来一次</button></div>`);
  on("again",reset);
}
function reset(){try{localStorage.removeItem("lyj_save")}catch(e){}S=fresh();intro()}

/* ---------- 启动 ---------- */
function boot(hot){
  S=(hot&&hot.S)||load()||fresh();
  if(!S.A||!S.H){S=fresh()}
  S.ban=S.ban||[];derive();
  if(S.ph==="end"&&S.end)return ending(S.end);
  if(S.ph==="day"){ if(!S.q||!S.q.length)buildDay(); return S.si>=S.q.length?settle():step(); }
  if(S.ph==="quiz")return quiz();
  if(S.ph==="quizres")return quizEnd();
  intro();
}
$("restart").onclick=()=>{if(confirm("重新开始？当前进度会被清空。"))reset()};
try{if(localStorage.getItem("wyh_save"))$("savenote").textContent="· 进度自动保存在本机"}catch(e){}
if(window.claude&&window.claude.hot){
  window.claude.hot.snapshot(()=>({S}));
  window.claude.hot.ready?window.claude.hot.ready(d=>boot(d)):boot(window.claude.hot.data);
}else boot();
</script>
